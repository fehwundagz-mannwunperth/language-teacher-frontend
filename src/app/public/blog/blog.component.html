<section class="page-shell page-section">
  <p class="eyebrow">{{ t('blog.eyebrow') }}</p>
  <h1>{{ t('blog.title') }}</h1>

  <div class="post-grid">
    @for (post of posts(); track post.id) {
      <mat-card appearance="outlined" [routerLink]="['/blog', post.id]" tabindex="0">
        <time>{{ post.createdAt | date: 'mediumDate' }}</time>
        <h2>{{ post.title }}</h2>
        <p>{{ post.summary }}</p>
      </mat-card>
    }
  </div>
</section>
