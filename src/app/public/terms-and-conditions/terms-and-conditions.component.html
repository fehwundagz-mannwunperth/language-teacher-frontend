<section class="page-shell page-section">
  <p class="eyebrow">{{ t('legal.terms.eyebrow') }}</p>
  <h1>{{ t('legal.terms.title') }}</h1>

  @if (terms$ | async; as terms) {
    <div class="terms-sections">
      @for (section of terms.sections; track section.key) {
        <mat-card appearance="outlined">
          <span>{{ section.order }}</span>
          <div>
            <h2>{{ t(sectionTitleKeys[section.key]) }}</h2>
            <p>{{ section.content }}</p>
          </div>
        </mat-card>
      }
    </div>
  }
</section>
