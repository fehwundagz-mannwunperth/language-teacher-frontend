@if (profile$ | async; as profile) {
  <section class="page-shell page-section">
    <p class="eyebrow">{{ t('about.eyebrow') }}</p>
    <h1>{{ profile.name }}</h1>
    <mat-card appearance="outlined">
      <p>{{ profile.bio }}</p>
      <p>{{ t('about.copy') }}</p>
      <p>{{ profile.location }} / {{ profile.yearsExperience }} {{ t('about.experience') }}.</p>
    </mat-card>
  </section>
}
