<section class="page-shell page-section">
  <p class="eyebrow">{{ t('lessons.eyebrow') }}</p>
  <h1>{{ t('lessons.title') }}</h1>

  <div class="card-grid">
    @for (lesson of lessonServices(); track lesson.id) {
      <a class="lesson-card-link" [routerLink]="['/lessons-services', lesson.id]">
        <app-section-card
          [title]="lesson.title"
          [eyebrow]="lesson.label"
          [description]="lesson.summary"
        />
      </a>
    }
  </div>
</section>
