<section class="page-shell page-section">
  <p class="eyebrow">{{ t('lessons.eyebrow') }}</p>
  <h1>{{ t('lessons.title') }}</h1>

  <div class="card-grid">
    @for (lesson of lessons$ | async; track lesson.id) {
      <app-section-card
        [title]="lesson.title"
        [eyebrow]="lesson.level + ' / ' + lesson.durationMinutes + ' min'"
        [description]="lesson.description"
      />
    }
  </div>
</section>
